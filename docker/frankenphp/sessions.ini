; Сессии админки — на постоянный диск (bind-mount), чтобы переживать
; перезапуск/пересоздание контейнера (ранее /tmp → «вход не пускает» после
; docker compose up). Директория создаётся docker-compose на хосте.
session.save_path=/var/www/html/storage/sessions

; Небольшая закалка куки сессии
session.cookie_httponly=1
session.cookie_samesite=Lax